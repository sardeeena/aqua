<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold-grad)" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  
  <!-- Anchor & Marine Crown Emblem -->
  <g transform="translate(0, -10)">
    <!-- Crown / Top ring -->
    <circle cx="256" cy="150" r="32" fill="none" stroke="url(#gold-grad)" stroke-width="16"/>
    <!-- Central Mast -->
    <line x1="256" y1="182" x2="256" y2="350" stroke="url(#gold-grad)" stroke-width="18" stroke-linecap="round"/>
    <!-- Crossbar -->
    <line x1="200" y1="220" x2="312" y2="220" stroke="url(#gold-grad)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="200" cy="220" r="10" fill="url(#gold-grad)"/>
    <circle cx="312" cy="220" r="10" fill="url(#gold-grad)"/>
    <!-- Curved Anchor Arms -->
    <path d="M 160 300 C 160 385, 352 385, 352 300" fill="none" stroke="url(#gold-grad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Flukes -->
    <polygon points="144,300 160,265 176,300" fill="url(#gold-grad)"/>
    <polygon points="336,300 352,265 368,300" fill="url(#gold-grad)"/>
    <!-- Dynamic Ocean Wave -->
    <path d="M 120 370 Q 188 330, 256 370 T 392 370" fill="none" stroke="url(#gold-grad)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="256" y="445" font-family="'Playfair Display', serif" font-size="34" font-weight="bold" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="6">AQUAWAY</text>
  <text x="256" y="475" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#a0a0a0" text-anchor="middle" letter-spacing="4">RED SEA TOURS</text>
</svg>
